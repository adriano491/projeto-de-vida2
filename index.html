<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Futuro com a Matemática</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #020617);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      margin-bottom: 25px;
      font-size: 34px;
      color: #60a5fa;
      text-shadow: 0 0 10px rgba(96,165,250,0.3);
    }

    .container {
      width: 90%;
      max-width: 900px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .tabs {
      display: flex;
      justify-content: space-between;
      margin-bottom: 30px;
    }

    .tab {
      flex: 1;
      padding: 15px;
      margin: 5px;
      text-align: center;
      cursor: pointer;
      border-radius: 10px;
      transition: 0.3s;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .tab:hover {
      background: rgba(96,165,250,0.2);
    }

    .tab.active {
      background: #3b82f6;
      color: white;
      font-weight: bold;
      box-shadow: 0 0 10px #3b82f6;
    }

    .content {
      display: none;
      text-align: center;
      animation: fade 0.4s ease;
    }

    .content.active {
      display: block;
    }

    @keyframes fade {
      from {opacity: 0; transform: translateY(10px);}
      to {opacity: 1; transform: translateY(0);}
    }

    .card {
      background: rgba(255,255,255,0.05);
      padding: 25px;
      border-radius: 15px;
      margin-top: 20px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    h2 {
      margin-bottom: 10px;
      color: #93c5fd;
    }

    .timer {
      font-size: 26px;
      margin-top: 15px;
      font-weight: 600;
      color: #60a5fa;
      text-shadow: 0 0 8px rgba(96,165,250,0.5);
    }

    @media (max-width: 600px) {
      .tabs {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <h1>📊 Meu Futuro com a Matemática</h1>

  <div class="container">

    <div class="tabs">
      <div class="tab active" onclick="openTab(0)">🎓 Faculdade</div>
      <div class="tab" onclick="openTab(1)">📚 Colégio</div>
      <div class="tab" onclick="openTab(2)">💼 Emprego</div>
    </div>

    <div class="content active">
      <div class="card">
        <h2>Faculdade</h2>
        <p>Objetivo: Entrar em uma faculdade</p>
        <p>Prazo: 31/12/2026</p>
        <div class="timer" id="timer1"></div>
      </div>
    </div>

    <div class="content">
      <div class="card">
        <h2>Colégio</h2>
        <p>Objetivo: Concluir o ensino médio</p>
        <p>Prazo: 31/12/2026</p>
        <div class="timer" id="timer2"></div>
      </div>
    </div>

    <div class="content">
      <div class="card">
        <h2>Emprego</h2>
        <p>Objetivo: Conseguir um emprego estável</p>
        <p>Prazo: 31/12/2026</p>
        <div class="timer" id="timer3"></div>
      </div>
    </div>

  </div>

  <script>
    function openTab(index) {
      let tabs = document.querySelectorAll(".tab");
      let contents = document.querySelectorAll(".content");

      tabs.forEach(tab => tab.classList.remove("active"));
      contents.forEach(content => content.classList.remove("active"));

      tabs[index].classList.add("active");
      contents[index].classList.add("active");
    }

    function startCountdown(id, date) {
      function updateTimer() {
        const now = new Date().getTime();
        const distance = date - now;

        if (distance < 0) {
          document.getElementById(id).innerHTML = "Tempo encerrado!";
          return;
        }

        let days = Math.floor(distance / (1000 * 60 * 60 * 24));
        let hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
        let minutes = Math.floor((distance / 1000 / 60) % 60);
        let seconds = Math.floor((distance / 1000) % 60);

        document.getElementById(id).innerHTML =
          `${days}d ${hours}h ${minutes}m ${seconds}s`;
      }

      setInterval(updateTimer, 1000);
    }

    startCountdown("timer1", new Date("Dec 31, 2026 23:59:59").getTime());
    startCountdown("timer2", new Date("Dec 31, 2026 23:59:59").getTime());
    startCountdown("timer3", new Date("Dec 31, 2026 23:59:59").getTime());
  </script>

</body>
</html>
